<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Anime Player</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        ANIME<span>PLAY</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
    </nav>

</header>


<main>

    <section class="hero">

        <div class="hero-content">

            <p class="hero-label">
                WELCOME TO
            </p>

            <h1>
                Anime Player
            </h1>

            <p>
                Watch your legally hosted anime collection
                with automatic episode playback.
            </p>

            <a href="#anime-list"
               class="btn">
                Browse Anime
            </a>

        </div>

    </section>


    <section class="container"
             id="anime-list">

        <div class="section-header">

            <h2>
                Anime
            </h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Cari anime..."
            >

        </div>


        <div
            id="animeContainer"
            class="anime-grid">
        </div>

    </section>

</main>


<footer>

    <p>
        © 2026 Anime Player
    </p>

</footer>


<script src="js/data.js"></script>
<script src="js/anime.js"></script>

</body>

</html>
